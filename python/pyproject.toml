[project]
name = "poslink"
version = "0.1.0.dev0"
description = "POS Link protocol v2 reference implementation (frames and security)"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["cryptography>=42"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
